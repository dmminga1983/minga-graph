[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minga-graph"
version = "0.1.0"
description = "Local, explainable knowledge graph of a codebase for Claude Code and other AI assistants. Zero dependencies, no network, no telemetry."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "dmminga1983" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["knowledge-graph", "code-analysis", "claude-code", "mcp", "ast", "developer-tools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/dmminga1983/minga-graph"
Issues = "https://github.com/dmminga1983/minga-graph/issues"

[project.scripts]
minga-graph = "minga_graph.cli:main"

[tool.setuptools]
packages = ["minga_graph", "minga_graph.extractors"]

[tool.setuptools.package-data]
minga_graph = ["skill/SKILL.md"]
